[package]
name = "varia"
version = "0.1.0"
edition = "2024"

[dependencies]
age = { version = "0.12", default-features = false }
axum = "0.8.9"
base64 = "0.22"
futures = "0.3"
getrandom = "0.3"
http = "1.3"
object_store = { version = "0.12", default-features = false, features = ["aws", "tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
